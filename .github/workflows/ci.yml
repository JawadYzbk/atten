name: CI

on:
  pull_request:
  push:
    branches: [main, "release/**", "design/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: |
          XCODE="$(ls -d /Applications/Xcode_16*.app | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          swift --version
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.2"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"
      - name: Validate locked dependencies
        run: uv lock --check
      - name: Test Swift application
        run: swift test
      - name: Test Python backend
        run: uv run python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build release configuration
        run: swift build -c release

  windows-app:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish the self-contained Windows app
        shell: pwsh
        run: >-
          dotnet publish apps/windows/Atten.Windows/Atten.Windows.csproj
          -c Release -r win-x64 --self-contained true
          -o .build/windows-ci-publish
